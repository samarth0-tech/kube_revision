apiVersion: apps/v1
kind: Deployment
metadata:
  name: set15-final-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: final-app
  template:
    metadata:
      labels:
        app: final-app
    spec:
      containers:
      - name: web
        image: samarthvp12/final-web-app:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: set15-final-service
spec:
  type: NodePort
  selector:
    app: final-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80